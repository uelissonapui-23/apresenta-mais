name: Atualizar Supabase em produção

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'scripts/apply-apresenta-migrations.sh'
      - '.github/workflows/deploy-supabase-production.yml'
  workflow_dispatch:

concurrency:
  group: apresenta-mais-supabase-production
  cancel-in-progress: false

jobs:
  deploy-database:
    name: Aplicar migrations do Apresenta Mais
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Validar conexão configurada
        shell: bash
        run: |
          test -n "$SUPABASE_DB_URL" || {
            echo "SUPABASE_DB_URL não configurado nos secrets do GitHub."
            exit 1
          }

      - name: Instalar cliente PostgreSQL
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Testar conexão com o banco
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -X \
            -c "select current_database() as database, current_user as connected_as;"

      - name: Aplicar migrations isoladas do Apresenta Mais
        shell: bash
        run: |
          chmod +x scripts/apply-apresenta-migrations.sh
          scripts/apply-apresenta-migrations.sh

      - name: Conferir migrations do Apresenta Mais
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -X \
            -c "select version, applied_at from apresenta_mais._migration_history order by version;"
