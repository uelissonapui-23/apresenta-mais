name: Validar aplicação

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: apresenta-mais-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, tipos, segurança e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar release
        run: npm run check:release
